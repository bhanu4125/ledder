server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
ledgerline:
  environment: PRODUCTION
  secure-cookies: true
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
